<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interior Designer - Scandinavian Studio</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f9fa;
        }
        #ui-overlay {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 18px 22px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 270px;
        }
        #ui-overlay h2 {
            margin: 0 0 4px 0;
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: -0.3px;
        }
        #ui-overlay p {
            margin: 0 0 12px 0;
            font-size: 11px;
            color: #666;
            line-height: 1.4;
        }
        .control-group {
            margin-bottom: 12px;
        }
        .control-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #444;
            margin-bottom: 4px;
        }
        .btn-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        button {
            flex: 1;
            min-width: 70px;
            padding: 6px 8px;
            font-size: 11px;
            font-weight: 500;
            border: 1px solid #d1d5db;
            background: #ffffff;
            color: #374151;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }
        button.active {
            background: #111827;
            color: #ffffff;
            border-color: #111827;
        }
        .spawn-btn {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
            font-weight: 600;
        }
        .spawn-btn:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>

    <!-- Load Three.js & OrbitControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-overlay">
        <h2>Scandinavian Studio</h2>
        <p>Rotate: Left Click + Drag | Pan: Right Click</p>
        
        <div class="control-group">
            <label>Wall Color</label>
            <div class="btn-row">
                <button onclick="setWallColor(0xfaf9f6, this)" class="active">Off-White</button>
                <button onclick="setWallColor(0xe8edea, this)">Sage</button>
                <button onclick="setWallColor(0xdedad2, this)">Warm Grey</button>
            </div>
        </div>

        <div class="control-group">
            <label>Floor Finish</label>
            <div class="btn-row">
                <button onclick="setFloorColor(0xe3d3c3, this)" class="active">Light Oak</button>
                <button onclick="setFloorColor(0x8b5a2b, this)">Walnut</button>
                <button onclick="setFloorColor(0xd1d5db, this)">Concrete</button>
            </div>
        </div>

        <div class="control-group">
            <label>Furniture & Decor Spawner</label>
            <div class="btn-row">
                <button class="spawn-btn" onclick="spawnFurniture('chair')">+ Chair</button>
                <button class="spawn-btn" onclick="spawnFurniture('sofa')">+ Sofa</button>
                <button class="spawn-btn" onclick="spawnFurniture('plant')">+ Plant</button>
                <button class="spawn-btn" onclick="spawnFurniture('lamp')">+ Lamp</button>
                <button class="spawn-btn" onclick="spawnFurniture('rug')">+ Rug</button>
                <button class="spawn-btn" onclick="spawnFurniture('frame')">+ Frame</button>
                <button onclick="clearFurniture()" style="background:#ef4444; color:white; border-color:#ef4444; min-width:100%;">Clear All Spawns</button>
            </div>
        </div>

        <div class="control-group" style="margin-top: 15px;">
            <button onclick="saveRoomLayout()" style="background:#10b981; color:white; border-color:#10b981; width:100%; font-weight:600; padding:8px;">💾 Save Room Layout</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // 1. Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf4f5f7);

        // 2. Camera Setup
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 11, 16);

        // 3. Renderer Setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 4. Orbit Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.02;

        // 5. Soft Studio Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xfff5ee, 0.6);
        keyLight.position.set(12, 18, 10);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        keyLight.shadow.bias = -0.0001;
        scene.add(keyLight);

        // 6. Room Dimensions & Materials
        const roomWidth = 12;
        const roomDepth = 12;
        const wallHeight = 4.5;

        // Floor Mesh
        const floorGeo = new THREE.PlaneGeometry(roomWidth, roomDepth);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xe3d3c3, roughness: 0.8, side: THREE.DoubleSide });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Grid Helper
        const gridHelper = new THREE.GridHelper(roomWidth, 12, 0xd0d4dc, 0xe8ecf0);
        gridHelper.position.y = 0.002;
        scene.add(gridHelper);

        // Walls Mesh
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xfaf9f6, roughness: 0.9, side: THREE.DoubleSide });

        const backWallGeo = new THREE.PlaneGeometry(roomWidth, wallHeight);
        const backWall = new THREE.Mesh(backWallGeo, wallMat);
        backWall.position.set(0, wallHeight / 2, -roomDepth / 2);
        backWall.receiveShadow = true;
        scene.add(backWall);

        const leftWallGeo = new THREE.PlaneGeometry(roomDepth, wallHeight);
        const leftWall = new THREE.Mesh(leftWallGeo, wallMat);
        leftWall.position.set(-roomWidth / 2, wallHeight / 2, 0);
        leftWall.rotation.y = Math.PI / 2;
        leftWall.receiveShadow = true;
        scene.add(leftWall);

        // 7. Base Table
        const tableMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 0.7 });
        const tableTopGeo = new THREE.BoxGeometry(3.6, 0.15, 2.2);
        const tableTop = new THREE.Mesh(tableTopGeo, tableMat);
        tableTop.position.set(0, 1.8, 0);
        tableTop.castShadow = true;
        tableTop.receiveShadow = true;
        scene.add(tableTop);

        const legGeo = new THREE.CylinderGeometry(0.08, 0.08, 1.8);
        const legPositions = [
            [-1.6, 0.9, -0.9], [1.6, 0.9, -0.9],
            [-1.6, 0.9, 0.9],  [1.6, 0.9, 0.9]
        ];
        legPositions.forEach(pos => {
            const leg = new THREE.Mesh(legGeo, tableMat);
            leg.position.set(...pos);
            leg.castShadow = true;
            scene.add(leg);
        });

        // Track spawned objects
        let spawnedObjects = [];

        // Interactive UI Functions
        window.setWallColor = function(hexColor, btn) {
            wallMat.color.setHex(hexColor);
            const buttons = btn.parentElement.querySelectorAll('button');
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        };

        window.setFloorColor = function(hexColor, btn) {
            floorMat.color.setHex(hexColor);
            const buttons = btn.parentElement.querySelectorAll('button');
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        };

        window.spawnFurniture = function(type) {
            let group = new THREE.Group();
            let randomX = (Math.random() - 0.5) * 6;
            let randomZ = (Math.random() - 0.5) * 6 + 2;

            if (type === 'chair') {
                const seatMat = new THREE.MeshStandardMaterial({ color: 0x4a5568, roughness: 0.6 });
                const seat = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.2, 1.2), seatMat);
                seat.position.y = 0.8; seat.castShadow = true; group.add(seat);

                const back = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 0.2), seatMat);
                back.position.set(0, 1.5, -0.5); back.castShadow = true; group.add(back);

                const chairLegMat = new THREE.MeshStandardMaterial({ color: 0x111827 });
                for (let i = -0.5; i <= 0.5; i += 1) {
                    for (let j = -0.5; j <= 0.5; j += 1) {
                        const cl = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.8), chairLegMat);
                        cl.position.set(i, 0.4, j); cl.castShadow = true; group.add(cl);
                    }
                }
                group.position.set(randomX, 0, randomZ);

            } else if (type === 'sofa') {
                const sofaMat = new THREE.MeshStandardMaterial({ color: 0x718096, roughness: 0.8 });
                const base = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.5, 1.4), sofaMat);
                base.position.y = 0.45; base.castShadow = true; group.add(base);
                
                const back = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.2, 0.3), sofaMat);
                back.position.set(0, 1.1, -0.55); back.castShadow = true; group.add(back);
                
                const armGeo = new THREE.BoxGeometry(0.3, 0.9, 1.4);
                const leftArm = new THREE.Mesh(armGeo, sofaMat);
                leftArm.position.set(-1.6, 0.8, 0); leftArm.castShadow = true; group.add(leftArm);
                
                const rightArm = new THREE.Mesh(armGeo, sofaMat);
                rightArm.position.set(1.6, 0.8, 0); rightArm.castShadow = true; group.add(rightArm);

                group.position.set(randomX, 0, randomZ);

            } else if (type === 'plant') {
                const potMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
                const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.3, 0.9, 16), potMat);
                pot.position.y = 0.45; pot.castShadow = true; group.add(pot);

                const plantMat = new THREE.MeshStandardMaterial({ color: 0x276749, roughness: 0.5 });
                for (let i = 0; i < 5; i++) {
                    const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), plantMat);
                    leaf.position.set((Math.random() - 0.5) * 0.4, 1.0 + i * 0.2, (Math.random() - 0.5) * 0.4);
                    leaf.scale.set(0.8, 1.5, 0.8); leaf.castShadow = true; group.add(leaf);
                }
                group.position.set(randomX, 0, randomZ);

            } else if (type === 'lamp') {
                const metalMat = new THREE.MeshStandardMaterial({ color: 0x2d3748, metalness: 0.8, roughness: 0.2 });
                const base = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.1, 16), metalMat);
                base.position.y = 0.05; base.castShadow = true; group.add(base);

                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 4.5), metalMat);
                pole.position.y = 2.25; pole.castShadow = true; group.add(pole);

                const shadeMat = new THREE.MeshStandardMaterial({ color: 0xfffaf0, roughness: 0.3, side: THREE.DoubleSide });
                const shade = new THREE.Mesh(new THREE.ConeGeometry(0.8, 1.2, 16, 1, true), shadeMat);
                shade.position.y = 4.0; shade.castShadow = true; group.add(shade);

                group.position.set(randomX, 0, randomZ);

            } else if (type === 'rug') {
                const rugMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 1.0 });
                const rug = new THREE.Mesh(new THREE.PlaneGeometry(4.5, 3.5), rugMat);
                rug.rotation.x = -Math.PI / 2;
                rug.position.set(randomX, 0.005, randomZ);
                rug.receiveShadow = true;
                group.add(rug);

            } else if (type === 'frame') {
                const frameMat = new THREE.MeshStandardMaterial({ color: 0x1a202c });
                const canvasMat = new THREE.MeshStandardMaterial({ color: 0xf7fafc, roughness: 0.9 });
                
                const frameOuter = new THREE.Mesh(new THREE.BoxGeometry(2.0, 2.5, 0.1), frameMat);
                const frameInner = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.3, 0.12), canvasMat);
                
                const frameGroup = new THREE.Group();
                frameGroup.add(frameOuter);
                frameGroup.add(frameInner);

                frameGroup.position.set((Math.random() - 0.5) * 6, 2.5, -roomDepth / 2 + 0.06);
                scene.add(frameGroup);
                spawnedObjects.push(frameGroup);
                return;
            }

            scene.add(group);
            spawnedObjects.push(group);
        };

        window.clearFurniture = function() {
            spawnedObjects.forEach(obj => {
                scene.remove(obj);
            });
            spawnedObjects = [];
        };

        // Database Save Functionality
        window.saveRoomLayout = function() {
            const payload = {
                name: "My Scandinavian Studio",
                wall_color: '0x' + wallMat.color.getHexString(),
                floor_color: '0x' + floorMat.color.getHexString(),
                furniture_data: [] 
            };

            fetch('/api/save/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    alert('Room layout successfully saved to Django Database! (ID: ' + data.layout_id + ')');
                } else {
                    alert('Error saving room: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Failed to connect to backend.');
            });
        };

        // 8. Window Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 9. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>

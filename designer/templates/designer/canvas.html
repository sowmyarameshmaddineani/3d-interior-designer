<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interior Designer - Scandinavian Studio</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f9fa;
        }
        #ui-overlay {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 18px 22px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 240px;
        }
        #ui-overlay h2 {
            margin: 0 0 6px 0;
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: -0.3px;
        }
        #ui-overlay p {
            margin: 0 0 12px 0;
            font-size: 11px;
            color: #666;
            line-height: 1.4;
        }
        .control-group {
            margin-bottom: 12px;
        }
        .control-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #444;
            margin-bottom: 4px;
        }
        .btn-row {
            display: flex;
            gap: 6px;
        }
        button {
            flex: 1;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: 500;
            border: 1px solid #d1d5db;
            background: #ffffff;
            color: #374151;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }
        button.active {
            background: #111827;
            color: #ffffff;
            border-color: #111827;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>

    <!-- Load Three.js & OrbitControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-overlay">
        <h2>Scandinavian Studio</h2>
        <p>Rotate: Left Click + Drag | Pan: Right Click</p>
        
        <div class="control-group">
            <label>Wall Color</label>
            <div class="btn-row">
                <button onclick="setWallColor(0xfaf9f6, this)" class="active">Off-White</button>
                <button onclick="setWallColor(0xe8edea, this)">Sage</button>
                <button onclick="setWallColor(0xdedad2, this)">Warm Grey</button>
            </div>
        </div>

        <div class="control-group">
            <label>Floor Finish</label>
            <div class="btn-row">
                <button onclick="setFloorColor(0xe3d3c3, this)" class="active">Light Oak</button>
                <button onclick="setFloorColor(0x8b5a2b, this)">Walnut</button>
                <button onclick="setFloorColor(0xd1d5db, this)">Concrete</button>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // 1. Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf4f5f7);

        // 2. Camera Setup
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2, 11, 16);

        // 3. Renderer Setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 4. Orbit Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.02;

        // 5. Soft Studio Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xfff5ee, 0.6);
        keyLight.position.set(12, 18, 10);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        keyLight.shadow.bias = -0.0001;
        scene.add(keyLight);

        // 6. Room Dimensions & Materials
        const roomWidth = 12;
        const roomDepth = 12;
        const wallHeight = 4.5;

        // Floor Mesh
        const floorGeo = new THREE.PlaneGeometry(roomWidth, roomDepth);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xe3d3c3, roughness: 0.8, side: THREE.DoubleSide });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Grid Helper
        const gridHelper = new THREE.GridHelper(roomWidth, 12, 0xd0d4dc, 0xe8ecf0);
        gridHelper.position.y = 0.002;
        scene.add(gridHelper);

        // Walls Mesh
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xfaf9f6, roughness: 0.9, side: THREE.DoubleSide });

        const backWallGeo = new THREE.PlaneGeometry(roomWidth, wallHeight);
        const backWall = new THREE.Mesh(backWallGeo, wallMat);
        backWall.position.set(0, wallHeight / 2, -roomDepth / 2);
        backWall.receiveShadow = true;
        scene.add(backWall);

        const leftWallGeo = new THREE.PlaneGeometry(roomDepth, wallHeight);
        const leftWall = new THREE.Mesh(leftWallGeo, wallMat);
        leftWall.position.set(-roomWidth / 2, wallHeight / 2, 0);
        leftWall.rotation.y = Math.PI / 2;
        leftWall.receiveShadow = true;
        scene.add(leftWall);

        // 7. Minimalist Table
        const tableMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 0.7 });
        const tableTopGeo = new THREE.BoxGeometry(3.6, 0.15, 2.2);
        const tableTop = new THREE.Mesh(tableTopGeo, tableMat);
        tableTop.position.set(0, 1.8, 0);
        tableTop.castShadow = true;
        tableTop.receiveShadow = true;
        scene.add(tableTop);

        const legGeo = new THREE.CylinderGeometry(0.08, 0.08, 1.8);
        const legPositions = [
            [-1.6, 0.9, -0.9], [1.6, 0.9, -0.9],
            [-1.6, 0.9, 0.9],  [1.6, 0.9, 0.9]
        ];
        legPositions.forEach(pos => {
            const leg = new THREE.Mesh(legGeo, tableMat);
            leg.position.set(...pos);
            leg.castShadow = true;
            scene.add(leg);
        });

        // Interactive Functions for UI Buttons
        window.setWallColor = function(hexColor, btn) {
            wallMat.color.setHex(hexColor);
            // Update active button state in group
            const buttons = btn.parentElement.querySelectorAll('button');
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        };

        window.setFloorColor = function(hexColor, btn) {
            floorMat.color.setHex(hexColor);
            const buttons = btn.parentElement.querySelectorAll('button');
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        };

        // 8. Window Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 9. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
